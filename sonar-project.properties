sonar.organization=petclinix
sonar.projectKey=petclinix_java-springboot-react-mtier
sonar.projectName=Java Springboot with React
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ============================================================
# BACKEND (Java)
# ============================================================
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,backend/target/**

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage report (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ============================================================
# FRONTEND (TypeScript)
# ============================================================

# Coverage report (LCOV — Vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# TypeScript config
sonar.typescript.tsconfigPath=frontend/tsconfig.json
