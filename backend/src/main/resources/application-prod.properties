# Production profile
spring.datasource.url=jdbc:mariadb://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Never let JPA modify the production schema, schema changes must be explicit migrations
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# CORS — the supported production topology (docker-compose.yml) serves the frontend and
# this API through the same nginx origin on port 8080, so cross-origin requests are not
# expected here and no origin is allowed by default (deny-closed, unlike jwt.secret's
# fail-fast: the app still starts fine with CORS simply disabled). Only set
# CORS_ALLOWED_ORIGINS if this API is ever exposed directly to a browser origin other
# than the nginx ingress — comma-separate multiple origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
